name: PR hygiene

# Mechanically enforces the branch/PR rules described in README.md:
#   * work happens on feat/<n> or fix/<n>, cut from dev
#   * those PRs target dev, never main
#   * only dev may open a PR into main (validated releases)
#
# Automation branches are exempt: Dependabot names its own branches, and the
# Render ROADMAP workflow opens its PR from chore/roadmap because dev is
# protected. This job is a required status check, so anything that legitimately
# opens a PR has to be allowed through here or its PR can never merge.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  branch-and-target:
    name: branch-and-target
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate branch name and PR target
        uses: actions/github-script@v7
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        with:
          script: |
            const head = process.env.HEAD_REF;
            const base = process.env.BASE_REF;
            const isFork = process.env.IS_FORK === 'true';
            const actor = process.env.ACTOR || '';
            const problems = [];

            const AUTOMATION_BRANCHES = [/^dependabot\//, /^chore\/roadmap$/];
            const AUTOMATION_ACTORS = ['dependabot[bot]', 'github-actions[bot]'];

            if (AUTOMATION_BRANCHES.some((re) => re.test(head)) ||
                AUTOMATION_ACTORS.includes(actor)) {
              core.info(`Automation branch (${head} by ${actor}) — exempt.`);
              return;
            }

            if (base === 'main') {
              // main only ever receives validated releases from dev.
              if (head !== 'dev' && !isFork) {
                problems.push(
                  `PRs into \`main\` may only come from \`dev\`, but this one comes from ` +
                  `\`${head}\`. Retarget it at \`dev\` — main receives a release PR from ` +
                  `dev once the work is validated on the bench.`
                );
              }
            } else if (base === 'dev') {
              if (!/^(feat|fix)\/\d+/.test(head) && !isFork) {
                problems.push(
                  `Branch \`${head}\` does not follow the naming rule. Work branches are ` +
                  `\`feat/<n>\` or \`fix/<n>\` (each type has its own counter), so the ` +
                  `branch-issue workflow can open and track the right issue.`
                );
              }
            }

            if (problems.length) {
              core.setFailed(problems.join('\n\n'));
            } else {
              core.info(`OK: ${head} -> ${base}`);
            }
