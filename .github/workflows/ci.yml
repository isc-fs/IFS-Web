name: CI

# Build gate for the Astro site in code/.
#
# Runs on every PR into dev or main and on every push to those branches.
# The `build` job is the required status check on both protected branches.
#
# There is no deploy step yet — hosting has not been chosen. When it is,
# add a deploy job gated on `needs: build` and `github.ref == refs/heads/main`.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# A new push to the same branch/PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: code

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cheapest check first: dictionary drift needs no build and is the
      # failure `astro check` structurally cannot catch (see the script header).
      - name: Check i18n parity
        run: npm run check:i18n

      - name: Typecheck (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check internal links and language switch
        run: npm run check:links

      - name: Report build weight
        if: always()
        run: |
          {
            echo "### Build output"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Pages built | $(find dist -name '*.html' | wc -l | tr -d ' ') |"
            echo "| Total size | $(du -sh dist | cut -f1) |"
            echo
            echo "Ten largest files shipped to visitors:"
            echo
            echo '```'
            find dist -type f -exec du -h {} + | sort -rh | head -10
            echo '```'
            echo
            echo "> Hero photography is still camera-original (~90 MB in \`public/assets\`)."
            echo "> Tracked in the \"Before going live\" checklist in code/README.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.sha }}
          path: code/dist
          retention-days: 14
